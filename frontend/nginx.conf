server {
    # 3000 rather than nginx's default 80, to keep the port the app has always
    # run on and leave Dockercompose.yaml's "3000:3000" mapping unchanged.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. React Router owns /collection, /deck-builder and /decks
    # client-side; without this, a deep link or refresh on those paths 404s
    # because no matching file exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
