# Two databases, two independent version histories, one ini file.
#
# Tome's schemas live in different databases with different operators
# (docs/architecture.md#data-boundary-two-databases-one-join-key), so they
# migrate separately. Alembic supports this with named sections selected by
# -n/--name, each pointing at its own script_location:
#
#   alembic -n local     upgrade head   # the user's own DB -- runs on client start
#   alembic -n knowledge upgrade head   # the shared corpus -- maintainers only
#
# See "Run Multiple Alembic Environments from one .ini file":
# https://alembic.sqlalchemy.org/en/latest/cookbook.html
#
# There is deliberately no plain [alembic] section. A bare `alembic upgrade
# head` has no correct answer here and must fail rather than pick a plane.

[DEFAULT]
# sys.path path, prepended to sys.path. Both environments import `config` and
# `database.*`, which assume backend/ is the root -- same as pytest.ini.
prepend_sys_path = .

# Use os.pathsep for splitting path lists.
path_separator = os

# Deliberately a placeholder. Each environment's env.py overwrites this at
# runtime from config.Settings, so there is exactly one place to configure a
# database URL. Set KNOWLEDGE_DATABASE_URL / LOCAL_DATABASE_URL in
# backend/.env, not here.
sqlalchemy.url = driver://user:pass@localhost/dbname


[local]
# The client plane: collection, decks, deck_cards. Migrated against
# LOCAL_DATABASE_URL, on the user's own machine.
script_location = %(here)s/alembic/local


[knowledge]
# The knowledge plane: cards, card_metadata, import_runs. Migrated against
# KNOWLEDGE_DATABASE_URL, the shared cloud Postgres. A run here is a publish
# visible to every user at once.
script_location = %(here)s/alembic/knowledge


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration.  This is also consumed by the user-maintained
# env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
